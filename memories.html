<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWIOI Memories - Scrapbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Work+Sans:wght@300;400;500;600&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/navbar.css">
  <link rel="stylesheet" href="/assets/css/hero.css">
  <link rel="stylesheet" href="/assets/css/cards.css">
  <link rel="stylesheet" href="/assets/css/gallery.css">
  <link rel="stylesheet" href="/assets/css/forms.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
  <link rel="stylesheet" href="/assets/css/darkmode.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
  
  <script src="/assets/js/utils.js" defer></script>
  <script src="/assets/js/theme.js" defer></script>
  <script src="/assets/js/loader.js" defer></script>
  <script src="/assets/js/memories.js" defer></script>
</head>
<body>

<div id="navbar-placeholder"></div>

<section class="page active" id="page-memories">
  <div class="page-head">
    <div class="kicker">the scrapbook</div>
    <h1>Memories</h1>
    <p>Every photo tells a small story. Pinned, taped, and never quite in a straight line — the way memories actually are.</p>
    <div class="filmstrip"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  </div>

  <div class="chips" id="chips">
    <button class="chip active" data-cat="all">All</button>
    <button class="chip" data-cat="freshers">Freshers</button>
    <button class="chip" data-cat="hackathon">Hackathon</button>
    <button class="chip" data-cat="farewell">Farewell</button>
    <button class="chip" data-cat="sports">Sports</button>
    <button class="chip" data-cat="industrial">Industrial Visit</button>
    <button class="chip" data-cat="cultural">Cultural Fest</button>
    <button class="chip" data-cat="convocation">Convocation</button>
    <button class="chip" data-cat="trips">Trips</button>
  </div>

  <div class="scrapbook" id="scrapbook"></div>
</section>

<div id="footer-placeholder"></div>

</body>
</html>
