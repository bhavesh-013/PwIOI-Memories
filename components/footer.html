    /* Handcrafted Custom Scrapbook Footer */
    .app-footer {
      background: var(--bg-alt);
      border-top: 1px dashed var(--line);
      padding: 22px 40px;
      margin-top: auto;
      width: 100%;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .footer-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    /* Left Logo */
    .footer-left {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .footer-logo-icon {
      transition: transform 0.3s ease;
    }
    
    .footer-left:hover .footer-logo-icon {
      transform: rotate(15deg) scale(1.1);
    }

    .logo-text {
      font-size: 15px;
      color: var(--ink);
      letter-spacing: -0.2px;
    }

    .brand-italic {
      font-family: 'Fraunces', Georgia, serif;
      font-style: italic;

    }

    .brand-bold {
      font-family: 'Work Sans', sans-serif;
      font-weight: 700;
      color: var(--ink);

    .muted-text {

      font-size: 13px;
      color: var(--ink-soft);

    }

    .highlight-text {

      gap: 5px;
    }

      display: flex;
      align-items: center;
      gap: 5px;
    }

    .heart-icon {
      display: flex;
      align-items: center;
      animation: footerHeartbeat 1.6s infinite ease-in-out;
    }

    @keyframes footerHeartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    /* Responsive adjustments */
    @media (max-width: 800px) {
      .app-footer {
        padding: 20px;
      }
      .footer-container {
        flex-direction: column;
        gap: 12px;
        text-align: center;
      }
      .footer-middle, .footer-right {
        justify-content: center;
        flex-wrap: wrap;
